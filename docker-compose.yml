services:
  icloud-hme:
    build:
      context: .
      dockerfile: Dockerfile
    image: icloud-hme:local
    container_name: icloud-hme
    restart: unless-stopped
    ports:
      - "${ICLOUD_HME_PORT:-8081}:8081"
    environment:
      ICLOUD_HME_ADMIN_USERNAME: "${ICLOUD_HME_ADMIN_USERNAME}"
      ICLOUD_HME_ADMIN_PASSWORD: "${ICLOUD_HME_ADMIN_PASSWORD}"
      ICLOUD_HME_SESSION_TTL: "${ICLOUD_HME_SESSION_TTL:-12h}"
      ICLOUD_HME_SECURE_COOKIE: "${ICLOUD_HME_SECURE_COOKIE:-false}"
      ICLOUD_HME_API_TOKEN: "${ICLOUD_HME_API_TOKEN:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
